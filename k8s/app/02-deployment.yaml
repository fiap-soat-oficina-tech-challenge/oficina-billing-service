# O CD substitui IMAGE_PLACEHOLDER pela imagem do ECR. Credenciais só por
# secretKeyRef. Segurança, espalhamento entre AZs e sondas seguem o OS Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing
  namespace: oficina-billing
  labels:
    app: oficina-billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-billing
  template:
    metadata:
      labels:
        app: oficina-billing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oficina-billing
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oficina-billing
      containers:
        - name: oficina-billing
          image: IMAGE_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: billing-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: JWT_SECRET
            - name: WEBHOOK_ORCAMENTO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: WEBHOOK_ORCAMENTO_TOKEN
            # Opcional: sem a chave o agente fica desligado e o serviço sobe mesmo assim.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Enquanto o serviço não tem dependências, readiness e liveness usam o
          # mesmo endpoint; a readiness passa a checar banco e filas quando eles
          # entrarem.
          startupProbe:
            httpGet:
              path: /billing/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /billing/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /billing/health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
