# Configuração não sensível. Segredos chegam pelo Secret `billing-secret`,
# criado pelo CD a partir do SSM: JWT_SECRET, WEBHOOK_ORCAMENTO_TOKEN,
# DATABASE_URL, MERCADO_PAGO_ACCESS_TOKEN, MAIL_LAMBDA_TOKEN e a license key do
# New Relic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: oficina-billing
data:
  NODE_ENV: "production"
  APPLICATION_PORT: "3000"
  LOG_LEVEL: "info"

  # Mensageria (terraform/sqs.tf). As credenciais da AWS vêm da role dos nós do
  # EKS, não de variável.
  AWS_REGION: "us-east-1"
  BILLING_COMMANDS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/008363475762/oficina-billing-commands"
  SAGA_REPLIES_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/008363475762/oficina-os-saga-replies"

  # Mercado Pago (QR Code dinâmico) com credenciais de teste: as cobranças
  # ficam ligadas a este caixa, criado uma vez na conta do vendedor de teste
  # (README, "Mercado Pago"). O aviso de pagamento não é configurado aqui: é o
  # webhook da aplicação no painel do Mercado Pago, apontado para
  # <API_GATEWAY_URL>/billing/webhooks/mercado-pago.
  MERCADO_PAGO_CAIXA_ID: "OFICINA01CAIXA01"

  # O e-mail sai pela Lambda /mail do API Gateway da plataforma
  # (tc3-auth-lambda). O endereço muda quando a plataforma é recriada, então o
  # CD troca API_GATEWAY_URL_PLACEHOLDER pelo valor do parâmetro API_GATEWAY_URL
  # do SSM, publicado por aquela stack.
  MAIL_LAMBDA_URL: "API_GATEWAY_URL_PLACEHOLDER/mail"

  # Observabilidade — mesmos valores do OS Service, mudando só o nome do app.
  NEW_RELIC_ENABLED: "true"
  NEW_RELIC_APP_NAME: "oficina-billing"
  NEW_RELIC_LABELS: "environment:production;project:tech-challenge-fiap"
  NEW_RELIC_NO_CONFIG_FILE: "true"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_DISTRIBUTED_TRACING_EXCLUDE_NEWRELIC_HEADER: "true"
  NEW_RELIC_TRANSACTION_EVENTS_MAX_SAMPLES_STORED: "2000"
  NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED: "1000"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "false"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  NEW_RELIC_LOG: "stdout"
  NEW_RELIC_LOG_LEVEL: "warn"
