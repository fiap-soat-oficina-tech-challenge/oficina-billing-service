# Análise no SonarQube Cloud, feita pelo CI (.github/workflows/ci.yml) depois
# dos testes: o relatório de cobertura do Jest (coverage/lcov.info) é enviado
# junto, e o quality gate decide se o job Build & Test passa.
sonar.organization=fiap-soat-oficina-tech-challenge
sonar.projectKey=fiap-soat-oficina-tech-challenge_oficina-billing-service
sonar.projectName=oficina-billing-service

# Código de produção e testes ficam juntos em src/: os testes são os *.spec.ts e
# os dublês em testes-de-apoio.ts.
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/testes-de-apoio.ts,src/generated/**
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/testes-de-apoio.ts

# Cobertura: o lcov do Jest, com as mesmas exclusões do collectCoverageFrom do
# package.json, para o número do SonarQube Cloud corresponder ao do README.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.module.ts,**/index.ts

# O job espera o resultado do quality gate e falha se ele reprovar.
sonar.qualitygate.wait=true
